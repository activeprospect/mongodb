sudo: required
language: elixir
otp_release:
  - 23.0
  - 24.0

elixir:
  - 1.12

matrix:
  exclude:
  - otp_release: 20.0
    elixir: 1.12
  - otp_release: 21.0
    elixir: 1.12
  - otp_release: 22.0
    elixir: 1.12

cache:
  - apt
  - directories:
    - ~/.mongodb
    - ./plt_core_path

before_install:
  - . $HOME/.nvm/nvm.sh
  - nvm install stable
  - nvm use stable
  - npm install -g mongodb-version-manager
  - m use $MONGOVERSION
  - bash ./start_mongo.bash
  - mkdir db

before_script:
  - export PATH=$(m path):$PATH
  - echo $PATH
  - mongod --fork --logpath mongo.log --dbpath db

script:
  - mix test
  - mix dialyzer --halt-exit-status

env:
  matrix:
    - MONGOVERSION=3.0.15 TRAVIS_NODE_VERSION=4
    - MONGOVERSION=3.2.22 TRAVIS_NODE_VERSION=4
    - MONGOVERSION=3.4.18 TRAVIS_NODE_VERSION=4
    - MONGOVERSION=3.6.9 TRAVIS_NODE_VERSION=4
    - MONGOVERSION=4.0.5 TRAVIS_NODE_VERSION=4
